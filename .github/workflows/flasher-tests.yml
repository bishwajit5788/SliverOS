name: Web Flasher Tests & Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-flasher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flasher
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Web Flasher Test Suite
        run: npm test

      - name: Build Web Flasher Production Bundle
        run: npm run build

      - name: Verify Bundle Output
        run: test -f dist/index.html && echo "Production bundle built successfully"

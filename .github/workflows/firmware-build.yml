name: ESP-IDF Firmware Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with ESP-IDF Docker
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32s3
          path: '.'

      - name: Validate Build Artifacts & Partition Limits
        run: |
          test -f build/bootloader/bootloader.bin
          test -f build/partition_table/partition-table.bin
          test -f build/microkernel-esp32.bin
          echo "All ESP32-S3 firmware build artifacts generated successfully."
          BIN_SIZE=$(stat -c%s build/microkernel-esp32.bin || stat -f%z build/microkernel-esp32.bin)
          echo "Firmware binary size: $BIN_SIZE bytes (OTA partition slot: 2,621,440 bytes)"
          if [ "$BIN_SIZE" -gt 2621440 ]; then
            echo "ERROR: Firmware size exceeds OTA partition slot limit (0x280000)!"
            exit 1
          fi
          echo "Firmware successfully validated against partition boundaries."
